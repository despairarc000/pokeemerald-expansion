[package]
name = "map-studio"
version = "0.17.0"
edition = "2024"
publish = false
description = "Native Rust Android map editor for pokeemerald-expansion"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "map-studio"
path = "src/main.rs"

[[bin]]
name = "map-studio-cli"
path = "src/bin/cli.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity", "x11"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4","serde"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking","json","rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
strip = "strip"
package = "dev.despairarc.mapstudio.projectspreview"
apk_name = "map-studio-projects-preview"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Map Studio Projects Preview"

# Explicitly support split-screen and freeform Android activities.
# NativeActivity receives surface/config changes without a forced restart.
[package.metadata.android.application.activity]
resizeable_activity = true
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# Small native Android builds; release-mode only, leaving fast debug iterations unchanged.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
debug = 0
panic = "abort"
incremental = false
