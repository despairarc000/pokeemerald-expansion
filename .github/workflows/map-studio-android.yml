name: Map Studio (Rust Android)

on:
  push:
    branches:
      - feature/map-studio-native-android
      - feature/map-studio-metatile-sheet-browser
    paths:
      - 'tools/map-studio/**'
      - '.github/workflows/map-studio-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust model tests and desktop compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/map-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/map-studio
      - name: Install Linux GUI prerequisites
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format sources for compilation
        run: cargo fmt --all
      - name: Install atlas generator dependency
        run: python3 -m pip install --break-system-packages Pillow
      - name: Generate visual atlas verification artifact
        run: |
          python3 scripts/build_atlas.py ../.. target/emerald-metatiles.png
          python3 - <<'PY'
          from PIL import Image
          img=Image.open("target/emerald-metatiles.png").convert("RGBA")
          colors=set(img.getdata())
          assert img.size==(256,1024), img.size
          assert len(colors)>64, f"unexpectedly blank or low-color atlas: {len(colors)} colors"
          print("Verified atlas:",img.size,len(colors),"distinct RGBA colors")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: map-studio-emerald-atlas-preview
          path: tools/map-studio/target/emerald-metatiles.png
          if-no-files-found: error
      - name: Validate numerical map conversion
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Unit tests
        run: cargo test --lib
      - name: Audit source-defined tileset and NPC artwork
        run: |
          python3 - <<'PY'
          import glob,json,os,shutil
          from pathlib import Path
          from PIL import Image
          candidates=glob.glob('target/**/atlases/catalog.json',recursive=True)
          assert candidates,"Rust build did not generate a source tileset catalog"
          catalog_file=Path(max(candidates,key=os.path.getmtime))
          obj=json.loads(catalog_file.read_text())
          print("Usable source-defined tileset pairs:",obj["available"],
                "unavailable:",len(obj["omitted"]))
          assert obj["available"]>=60,obj["available"]
          keys={p["key"] for p in obj["pairs"]}
          required={"general/petalburg":"general__petalburg.png",
                    "general/cave":"general__cave.png",
                    "building/generic_building":"building__generic_building.png"}
          assert set(required).issubset(keys),keys
          audit=Path("target/studio-asset-audit")
          audit.mkdir(exist_ok=True,parents=True)
          shutil.copy2(catalog_file,audit/"catalog.json")
          for name in required.values():
              path=catalog_file.parent/name
              assert path.is_file(),path
              picture=Image.open(path).convert("RGBA")
              assert picture.size==(256,1024)
              # Palette-zero is transparent on every GBA BG layer. A
              # correctly decoded atlas can have fewer opaque colors than
              # the historical index-zero-as-paint rendering.
              pixels=list(picture.getdata())
              opaque=[pixel for pixel in pixels if pixel[3]>0]
              assert len(opaque)>4000,(name,"missing source art")
              assert len(set(opaque))>2,(name,"not enough distinct source colors")
              assert len(opaque)<len(pixels),(name,"lost metatile transparency")
              shutil.copy2(path,audit/name)
          sprites=list(catalog_file.parent.parent.glob("sprites/npc-previews.png"))
          assert sprites,"NPC sprites were not built"
          npc=Image.open(sprites[0])
          assert npc.width==192 and npc.height>=80
          shutil.copy2(sprites[0],audit/"npc-previews.png")
          print("Verified real atlas gallery and selected NPC previews")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: map-studio-source-visual-audit
          path: tools/map-studio/target/studio-asset-audit/
          if-no-files-found: error

      - name: CLI geometry regression tests
        run: cargo test --bin map-studio-cli
      - name: Headless Rust-to-Python export smoke test
        run: |
          cargo run --quiet --bin map-studio-cli -- new target/cli-test.json
          cargo run --quiet --bin map-studio-cli -- add-map target/cli-test.json TestVillage 0 0 10 10
          cargo run --quiet --bin map-studio-cli -- fill target/cli-test.json 1 0x170
          cargo run --quiet --bin map-studio-cli -- validate target/cli-test.json
          cargo run --quiet --bin map-studio-cli -- export target/cli-test.json target/cli-export.zip
          python3 - <<'PY'
          import json,zipfile,struct,importlib.util
          z=zipfile.ZipFile('target/cli-export.zip')
          layout=json.loads(z.read('custom_maps/Meadowmere_TestVillage/layout.mapstudio.json'))
          assert layout['format']=='mapstudio-numeric-v1'
          assert layout['cells'][0][0]==(0x170 | (3 << 12))
          print('CLI exported 10x10 native grid and project snapshot')
          PY
      - name: Convert CLI-exported layout with existing Pokémon map generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,subprocess,sys,json
          root=Path('../..').resolve()
          archive=zipfile.ZipFile('target/cli-export.zip')
          archive.extractall(root)
          subprocess.run([sys.executable,str(root/'tools/textmap/build_textmaps.py')],check=True)
          binary=(root/'data/layouts/Meadowmere_TestVillage/map.bin').read_bytes()
          assert len(binary)==200,len(binary)
          assert binary==struct.pack('<H',0x3170)*100
          map_json=json.loads((root/'data/maps/Meadowmere_TestVillage/map.json').read_text())
          assert map_json['layout']=='LAYOUT_MEADOWMERE_TESTVILLAGE'
          print('Verified native map generator output:',len(binary),'bytes; 100 packed cells')
          PY
      - name: Compile desktop UI
        run: cargo check --all-targets

  apk:
    name: Build optimized ARM64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/map-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/map-studio
      - name: Install Android SDK tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install --locked --git https://github.com/parasyte/cargo-apk.git --rev 282639508eeed7d73f2e1eaeea042da2716436d5 cargo-apk
      # The key is disposable: this is a sideload test APK, not a Play Store release.
      # The certificate changes between CI runs; uninstall older test builds before updating.
      - name: Generate temporary test signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/map-studio-test.keystore" -storepass android -keypass android -alias mapstudio -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Map Studio Test,O=Development,C=US"
      - name: Install atlas generator dependency
        run: python3 -m pip install --break-system-packages Pillow
      - name: Package optimized APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/map-studio-test.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: cargo apk build --release --lib --target aarch64-linux-android
      - name: Measure APK size
        run: |
          ls -lh target/release/apk/*.apk
          du -h target/release/apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: map-studio-arm64-optimized
          path: tools/map-studio/target/release/apk/*.apk
          if-no-files-found: error
