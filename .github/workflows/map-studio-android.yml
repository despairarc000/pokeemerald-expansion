name: Map Studio (Rust Android)

on:
  push:
    branches:
      - feature/map-studio-native-android
    paths:
      - 'tools/map-studio/**'
      - '.github/workflows/map-studio-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust model tests and desktop compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/map-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/map-studio
      - name: Install Linux GUI prerequisites
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format sources for compilation
        run: cargo fmt --all
      - name: Unit tests
        run: cargo test --lib
      - name: Compile desktop UI
        run: cargo check --all-targets

  apk:
    name: Build optimized ARM64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/map-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/map-studio
      - name: Install Android SDK tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install --locked --git https://github.com/parasyte/cargo-apk.git --rev 282639508eeed7d73f2e1eaeea042da2716436d5 cargo-apk
      # The key is disposable: this is a sideload test APK, not a Play Store release.
      # The certificate changes between CI runs; uninstall older test builds before updating.
      - name: Generate temporary test signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/map-studio-test.keystore" -storepass android -keypass android -alias mapstudio -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Map Studio Test,O=Development,C=US"
      - name: Package optimized APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/map-studio-test.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: cargo apk build --release --lib --target aarch64-linux-android
      - name: Measure APK size
        run: |
          ls -lh target/release/apk/*.apk
          du -h target/release/apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: map-studio-arm64-optimized
          path: tools/map-studio/target/release/apk/*.apk
          if-no-files-found: error
